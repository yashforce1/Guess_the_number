<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10121f">
    <title>Guess the Number</title>
    <link rel="stylesheet" href="guess.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="#home" aria-label="Number Play home">
            <span class="brand-mark" aria-hidden="true">?</span>
            <span>number<span class="brand-accent">play</span></span>
        </a>
        <nav aria-label="Main navigation">
            <a href="#home" id="home">Home</a>
        </nav>
    </header>

    <main id="home">
        <section class="game-shell" aria-labelledby="game-title">
            <div class="eyebrow"><span class="eyebrow-dot"></span> A little game of intuition</div>
            <h1 id="game-title">Guess the <span>number</span></h1>
            <p class="intro">I'm thinking of a number from <strong>1 to 100</strong>. Can you find it?</p>

            <div class="game-card">
                <div class="card-topline">
                    <span class="round-label"><span class="sparkle" aria-hidden="true">✦</span> YOUR CHALLENGE</span>
                    <span class="attempts"><span class="attempt-dot" aria-hidden="true"></span>10 attempts</span>
                </div>

                <form class="guess-form">
                    <label for="number">Enter your guess</label>
                    <div class="input-wrap">
                        <input type="number" min="1" max="100" inputmode="numeric" placeholder="e.g. 42" id="number" class="input" autocomplete="off">
                    </div>
                    <div class="button-row">
                        <button type="submit" id="submit_guess" class="enter">Make a guess <span aria-hidden="true">→</span></button>
                        <button type="button" id="restart" class="enter">Start over</button>
                    </div>
                </form>

                <div class="message-panel" aria-live="polite">
                    <span class="message-icon" aria-hidden="true">✦</span>
                    <p class="head_guess" id="low_high" role="status">Start guessing</p>
                </div>

                <div class="stats" aria-label="Game progress">
                    <div class="stat">
                        <span class="stat-label">PREVIOUS GUESSES</span>
                        <span class="stat-value" id="previous_guess">—</span>
                    </div>
                    <div class="stat stat-remaining">
                        <span class="stat-label">GUESSES LEFT</span>
                        <span class="stat-value" id="count_r">10</span>
                    </div>
                </div>
            </div>
            <p class="footer-note"><span aria-hidden="true">◎</span> Take your time. Every guess gets you closer.</p>
        </section>
    </main>
    <script src="guess.js"></script>
</body>
</html>
